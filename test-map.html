<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Task Map Test</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #map {
            height: 100vh;
            width: 100vw;
        }
        .custom-popup {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .popup-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .popup-price {
            font-weight: bold;
            color: #007bff;
            font-size: 16px;
            margin-bottom: 4px;
        }
        .popup-location {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        .popup-status {
            font-size: 12px;
            color: #333;
        }
        .marker-icon {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border: 3px solid white;
            border-radius: 50% 50% 50% 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transform: rotate(-45deg);
            position: relative;
        }
        .marker-icon::before {
            content: '$';
            transform: rotate(45deg);
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        try {
            console.log('🗺️ Initializing map...');
            
            // Initialize map centered on Sri Lanka
            const map = L.map('map', {
                minZoom: 6,
                maxZoom: 18,
                zoomControl: true
            }).setView([7.8731, 80.7718], 7);
            
            // Add tile layer
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 18
            }).addTo(map);

            // Test markers
            const markers = [
                {
                    id: 'test1',
                    lat: 6.9271,
                    lng: 79.8612,
                    title: 'Test Task in Colombo',
                    price: 'LKR 5,000',
                    location: 'Colombo, Sri Lanka',
                    status: 'open',
                    offers: 3
                },
                {
                    id: 'test2',
                    lat: 7.2906,
                    lng: 80.6337,
                    title: 'Test Task in Kandy',
                    price: 'LKR 3,500',
                    location: 'Kandy, Sri Lanka',
                    status: 'open',
                    offers: 1
                }
            ];
            
            console.log('🗺️ Adding test markers:', markers.length);
            
            const customIcon = L.divIcon({
                html: '<div class="marker-icon"><span style="transform: rotate(45deg); display: block;">$</span></div>',
                className: 'custom-div-icon',
                iconSize: [40, 40],
                iconAnchor: [20, 40],
                popupAnchor: [0, -40]
            });

            markers.forEach((marker, index) => {
                const popupContent = `
                    <div class="custom-popup">
                        <div class="popup-title">${marker.title}</div>
                        <div class="popup-price">${marker.price}</div>
                        <div class="popup-location">${marker.location}</div>
                        <div class="popup-status">${marker.status} • ${marker.offers} offer${marker.offers !== 1 ? 's' : ''}</div>
                    </div>
                `;
                
                console.log('📍 Creating marker', index + 1, 'at', marker.lat, marker.lng);
                const markerInstance = L.marker([marker.lat, marker.lng], { icon: customIcon })
                    .bindPopup(popupContent)
                    .addTo(map);
            });
            
            // Fit bounds to show all markers
            const bounds = L.latLngBounds(markers.map(m => [m.lat, m.lng]));
            map.fitBounds(bounds, { 
                padding: [20, 20],
                maxZoom: 12
            });
            
            console.log('✅ Map initialization complete');
            
        } catch (error) {
            console.error('❌ Map initialization failed:', error);
            document.body.innerHTML = '<div style="padding: 20px; text-align: center; color: #666;">Failed to load map: ' + error.message + '</div>';
        }
    </script>
</body>
</html>
